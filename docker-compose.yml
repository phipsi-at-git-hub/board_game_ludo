services:
  app:
    build: .
    container_name: bgl-app
    working_dir: /var/www/html/public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mailpit: 
        condition: service_started
  
  app_init: 
    build: . 
    container_name: bgl-app-init
    working_dir: /var/www/html
    env_file: 
      - .env
    command: ["sh", "-c", "sleep 5 && php", "bin/clean-logs.php"]
    depends_on: 
      - app
    
  app_cron: 
    build: . 
    container_name: bgl-app_cron
    working_dir: /var/www/html
    env_file:
      - .env
    # use only in prod environment with: docker compose --profile production up -d
    profiles:
      - production
    command: ["sh", "-c", "sleep 5 && while true; do php bin/clean-logs.php; sleep 86400; done"]
    depends_on: 
      - app

  web:
    image: nginx:stable
    container_name: bgl-web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: bgl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 2s
      timeout: 2s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bgl-phpmyadmin
    platform: linux/amd64
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

  mailpit: 
    image: axllent/mailpit:latest
    container_name: bgl-mailpit
    restart: unless-stopped
    ports: 
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
